<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="./fruit-img/logo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avo — FreshFind Assistant</title>

<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="chat-widget.css">
<link rel="stylesheet" href="bookmark-widget.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<link rel="stylesheet" href="../styles.css">
</head>
<body>

  
  <video
    class="bg-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    disablepictureinpicture
    aria-hidden="true"
  >
    <source src="vids/chat.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  
  <div class="app-shell">

    
    <div class="card">

      
      <header class="chat-header">
        <div class="avatar">
          <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true">
            <ellipse cx="20" cy="21" rx="12" ry="16" fill="#3d6b2f"/>
            <ellipse cx="20" cy="22" rx="9"  ry="13" fill="#c8e6a0"/>
            <circle  cx="20" cy="25" r="6"   fill="#8b5a2b"/>
          </svg>
        </div>
        <div>
          <h1>Avo</h1>
          <p>FreshFind Assistant</p>
        </div>

        <button class="voice-btn" id="voiceBtn" type="button" aria-label="Toggle voice">
          <svg class="icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg class="icon-muted" viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </header>

      
      <div class="stage" id="stage">
        <div class="speaking-ring"></div>

        <div class="avo-wrap">
          <div class="avo-svg avo-glb" id="avoGlb" role="img" aria-label="Avo the avocado"><canvas id="avoCanvas"></canvas><span class="avo-glb-loading" id="avoGlbLoading">Loading 3D…</span></div>
        </div>
      </div>

      
      <main class="messages" id="messages" aria-live="polite"></main>

      
      <div class="chips" id="chips"></div>

      
      <form class="composer" id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask about markets or produce..." aria-label="Message"></textarea>
        <button class="send" type="submit" aria-label="Send">➤</button>
      </form>

    </div>

  </div>

<script type="module" src="chat.js"></script>
<script src="navbar.js"></script>
<script src="chat-widget.js"></script>
<script src="bookmark-widget.js"></script>

</body>
</html>
